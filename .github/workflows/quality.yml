name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pull-request-history:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base and head SHAs below must both be present. The default shallow checkout only
          # contains the synthetic pull-request merge commit.
          fetch-depth: 0
      - name: Require a rebased pull-request branch
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          merge_commits="$(git rev-list --merges "$PR_BASE_SHA..$PR_HEAD_SHA")"
          test -z "$merge_commits" && exit 0

          echo "::error title=Rebase required::The pull-request branch contains merge commits. Rebase it onto main instead; merging main into a branch can make python-semantic-release omit changes from the next changelog."
          for commit in $merge_commits; do
            git show --no-patch --format='  %h %s' "$commit"
          done
          exit 1

  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # Not --all-groups: the release group carries semantic-release, which this job never runs.
        run: uv sync --group dev
      - name: Format check
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest
      # No raw `ruff check` or `mypy` step: both would demand zero violations and fail on
      # the grandfathered backlog the moment this repository froze one. `ebpy check` is the
      # gate — it runs ruff and mypy through the measurement seam and fails only on findings
      # above the ceiling.
      - name: Ratchet gate
        run: uv run ebpy check
      - name: Lint report
        if: always()
        run: uv run ebpy report

  # The mypy parser and lifecycle tests assume an output format ebpy claims to support from
  # mypy 1.10 onward (docs/defaults.md), but the `quality` job above only ever exercises the
  # single version the lockfile resolves. This job pins mypy to its supported floor and runs
  # exactly those real-toolchain tests against it, so the "supports 1.10+" claim is verified
  # rather than asserted. `--with` installs the floor over the locked version for this run only.
  mypy-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --group dev
      - name: mypy version
        run: uv run --with 'mypy>=1.10,<1.11' mypy --version
      - name: Parser and lifecycle tests against the mypy floor
        run: uv run --with 'mypy>=1.10,<1.11' pytest tests/test_runners.py tests/test_mypy_lifecycle.py
