name: release

# main is the only branch that ships. A merged PR that changed the command or the skills gets a
# version, a changelog entry, a tag and a GitHub Release; one that changed neither gets nothing.
# python-semantic-release decides all of that from the commits — see docs/release.md and the
# [tool.semantic_release] section of pyproject.toml. Nothing is published to a package index.
on:
  pull_request:
    types: [closed]
    branches: [main]
  # For re-running a release whose push failed. It reads main as it stands, so it is safe to
  # run when there is nothing to release: semantic-release then does nothing.
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, and never cancelled halfway: the bump, the tag and the GitHub Release
# are three steps of one command, and a cancelled run can leave them disagreeing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Fail here rather than after the gate, where the only symptom is a GH006 rejection.
      - name: Check the release key is configured
        env:
          RELEASE_SSH_KEY: ${{ secrets.RELEASE_SSH_KEY }}
        run: |
          test -n "$RELEASE_SSH_KEY" && exit 0
          echo "::error::RELEASE_SSH_KEY is unset; the release commit cannot reach protected main. See docs/release.md."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # main as a branch, not the merge commit: semantic-release refuses to release from a
          # detached HEAD, and it checks the upstream has not moved before it pushes anyway.
          ref: main
          # The whole history and its tags — the last tag is what the next version counts from.
          fetch-depth: 0
          # The deploy key the ruleset lets through; GITHUB_TOKEN is not something a ruleset
          # can be told to allow.
          ssh-key: ${{ secrets.RELEASE_SSH_KEY }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --all-groups
      # quality.yml ran against each PR's own head, not against the merge of them: two branches
      # green apart can be broken together, and a tag is the wrong place to find that out.
      # --no-write because a release run is not a ledger entry, and a dirty tree is not what
      # semantic-release should be handed.
      - name: Gate what is about to be tagged
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy .
          uv run pytest
          uv run ebpy check --no-write
      # Stamps the version into pyproject.toml, src/ebpy/__init__.py and uv.lock, writes
      # CHANGELOG.md, commits, tags, pushes both, and opens the GitHub Release. Exits cleanly
      # having done nothing when the commits warrant no version.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run semantic-release -v version
