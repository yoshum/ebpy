[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ebpy"
version = "0.1.0"
description = "Make an existing Python codebase one that can only get better — a Python port of ever-better."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Shuhei Yoshida" }]
keywords = ["lint", "ruff", "mypy", "baseline", "ratchet", "quality"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
# Zero runtime dependencies, deliberately — the tool that gates a repository's dependencies
# should not bring its own.
dependencies = []

[project.urls]
Homepage = "https://github.com/yoshum/ebpy"
Source = "https://github.com/yoshum/ebpy"

[project.scripts]
ebpy = "ebpy.cli:main"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/ebpy"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "B",   # bugbear
  "C90", # mccabe complexity
  "I",   # isort
  "N",   # naming
  "UP",  # pyupgrade
  "SIM", # simplify
  "C4",  # comprehensions
  "ARG", # unused arguments
  "PL",  # pylint
  "RUF", # ruff-specific
]
ignore = [
  "PLR2004", # magic values in comparisons — tests are full of literal expectations
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0913"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
