[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ebpy"
version = "0.7.0"
description = "Make an existing Python codebase one that can only get better — a Python port of ever-better."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Shuhei Yoshida" }]
keywords = ["lint", "ruff", "mypy", "baseline", "ratchet", "quality"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
# Zero runtime dependencies, deliberately — the tool that gates a repository's dependencies
# should not bring its own.
dependencies = []

[project.urls]
Homepage = "https://github.com/yoshum/ebpy"
Source = "https://github.com/yoshum/ebpy"

[project.scripts]
ebpy = "ebpy.cli:main"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5"]
release = ["python-semantic-release>=10.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/ebpy"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "ebpy/_skills"

# The lint rule set here is the one ebpy bootstraps into other repositories
# (src/ebpy/generate/configs.py). Keep the two in step.
[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "B",    # bugbear
  "PL",   # pylint
  "C90",  # mccabe complexity
  "I",    # isort
  "N",    # naming
  "UP",   # pyupgrade
  "SIM",  # simplify
  "PERF", # performance anti-patterns
  "FURB", # modern idioms
  "C4",   # comprehensions
  "ARG",  # unused arguments
  "A",    # builtin shadowing
  "ANN",  # annotations
  "TC",   # type-checking blocks
  "D",    # pydocstyle
  "PT",   # pytest
  "RUF",  # ruff-specific
  "PIE",  # misc
]
# W191/E111/E114/E117 are the indentation checks the formatter owns; D203/D206/D300/D213
# are the docstring rules that contradict D211, the formatter, D301, and D212.
ignore = [
  "W191",
  "E111",
  "E114",
  "E117",
  "D203",
  "D206",
  "D300",
  "D213",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Tests carry literal expectations and wide fixtures; the ratchet still counts everything else.
"tests/*" = ["PLR0913", "PLR2004"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# How this repository ships itself. Conventional Commits decide how far the version moves;
# `path_filters` decides whether there is a release at all.
[tool.semantic_release]
commit_parser = "conventional-monorepo"
tag_format = "v{version}"
# Both defaults changed in v10 and neither is what this repository wants: 0.x is refused
# outright unless allowed, and a breaking change is taken straight to 1.0.0. Reaching 1.0
# should be a decision somebody made rather than one a `!` made for them.
allow_zero_version = true
major_on_zero = false
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/ebpy/__init__.py:__version__"]
commit_message = "chore(release): v{version}"
# The lockfile records the project's own version, so `uv sync --locked` starts failing the
# moment pyproject.toml moves without it. --upgrade-package restamps that one entry and
# nothing else: a release is the wrong moment to also take whatever landed upstream today.
# Chained with && rather than written on two lines: semantic-release reports a multi-line
# build command as successful when only its last line succeeded, so a failed `uv lock` would
# be swallowed and the release tagged with a lockfile still naming the previous version.
build_command = 'uv lock --upgrade-package "$PACKAGE_NAME" && git add uv.lock'

[tool.semantic_release.remote]
# Push over the deploy key actions/checkout installed, not over GITHUB_TOKEN. The release
# commit lands on protected main, and github-actions[bot] is a system bot that cannot be
# granted a ruleset bypass — a deploy key can. The token is still what opens the Release.
ignore_token_for_push = true

# The release surface: the command and the skills a tag delivers. A commit touching neither
# is parsed for nothing — no version, no changelog entry. Directories match their subtrees,
# so `src/ebpy` covers `src/ebpy/**`.
[tool.semantic_release.commit_parser_options]
path_filters = ["src/ebpy", "skills"]
